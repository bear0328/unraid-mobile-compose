# 单容器部署;宿主 compose-api 由 scripts/bootstrap-host.sh 独立安装。
services:
  unraid-mobile:
    image: bear0328/unraid-mobile:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-unraid-mobile}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3999}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UNRAID_UPSTREAM: ${UNRAID_UPSTREAM:?请在 .env 中设置 UNRAID_UPSTREAM}
      UNRAID_SERVER_URL: ${UNRAID_SERVER_URL:-}
    volumes:
      - ${APPDATA_DIR:-/mnt/user/appdata/unraid-mobile}/config:/usr/share/nginx/html/config
      - ${APPDATA_DIR:-/mnt/user/appdata/unraid-mobile}/nginx:/etc/nginx/um-auth
      - /mnt/user:/mnt/user
      - /mnt/cache:/mnt/cache
      - /mnt:/mnt:ro
      - /var/log:/hostlog:ro
      - /var/run/php-fpm.sock:/hostrun/php-fpm.sock
    secrets:
      - dav_password
      - log_password
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

secrets:
  dav_password:
    file: ${APPDATA_DIR:-/mnt/user/appdata/unraid-mobile}/secrets/dav_password
  log_password:
    file: ${APPDATA_DIR:-/mnt/user/appdata/unraid-mobile}/secrets/log_password

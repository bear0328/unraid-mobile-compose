# 默认单服务器安装:setup 只运行一次并退出,Web 容器不持有宿主特权。
# 仅 Web 多服务器需要 router:docker compose --profile multi-server up -d
# 用户需提供 .env 与三个 secret 文件;详见 README_CN.md。
services:
  setup:
    image: bear0328/unraid-mobile-setup:${IMAGE_TAG:-latest}
    container_name: unraid-mobile-setup
    restart: "no"
    privileged: true
    pid: host
    environment:
      ALLOW_HOST_INSTALL: ${ALLOW_HOST_INSTALL:-NO}
      UNRAID_UPSTREAM: ${UNRAID_UPSTREAM:?请在 .env 中设置 UNRAID_UPSTREAM}
      UNRAID_SERVER_URL: ${UNRAID_SERVER_URL:-}
    volumes:
      - /:/host
      - /mnt/user/appdata/unraid-mobile:/appdata
    secrets:
      - unraid_api_key
      - dav_password
      - log_password

  router:
    image: bear0328/unraid-mobile-router:${IMAGE_TAG:-latest}
    container_name: unraid-mobile-router
    profiles: ["multi-server"]
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/user/appdata/unraid-mobile/config:/config:ro

  unraid-mobile:
    image: bear0328/unraid-mobile:${IMAGE_TAG:-latest}
    container_name: unraid-mobile
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3999:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UNRAID_UPSTREAM: ${UNRAID_UPSTREAM:?请在 .env 中设置 UNRAID_UPSTREAM}
    volumes:
      - /mnt/user/appdata/unraid-mobile/config:/usr/share/nginx/html/config
      - /mnt/user/appdata/unraid-mobile/nginx:/etc/nginx/um-auth:ro
      - /mnt/user:/mnt/user
      - /mnt/cache:/mnt/cache
      - /mnt:/mnt:ro
      - /var/log:/hostlog:ro
      - /var/run/php-fpm.sock:/hostrun/php-fpm.sock
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

secrets:
  unraid_api_key:
    file: ./secrets/unraid_api_key
  dav_password:
    file: ./secrets/dav_password
  log_password:
    file: ./secrets/log_password
